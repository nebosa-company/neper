name: macos-a64
on:
  push:
    branches: [macos-a64]
  workflow_dispatch:
jobs:
  run:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run the Neper-emitted aarch64-macos binaries
        run: |
          sw_vers; uname -m
          status=0
          for name in hello imp os1 fs1; do
            cp tests/macos/$name /tmp/$name && chmod +x /tmp/$name
            echo "== $name"; codesign --verify --verbose=4 /tmp/$name 2>&1 || true
            set +e; /tmp/$name; code=$?; set -e
            echo "exit=$code"
            if [ "$code" -ne 0 ]; then
              status=$code
              lldb -b -o run -o quit /tmp/$name 2>&1 | tail -15
              log show --last 2m --style compact --predicate 'process == "kernel" OR process == "amfid" OR sender == "AppleMobileFileIntegrity" OR process == "dyld"' 2>&1 | tail -30
            fi
          done
          exit $status
