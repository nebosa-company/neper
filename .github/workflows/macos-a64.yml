name: macos-a64
on:
  push:
    branches: [macos-a64]
  workflow_dispatch:
jobs:
  run:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run the Neper-emitted aarch64-macos binary
        run: |
          sw_vers; uname -m
          cp tests/macos/hello /tmp/hello && chmod +x /tmp/hello && cd /tmp
          file hello
          codesign -d -vvv hello 2>&1 || true
          codesign --verify --verbose=4 hello 2>&1 || true
          set +e
          ./hello; code=$?
          echo "exit=$code"
          if [ "$code" -ne 0 ]; then
            lldb -b -o run -o quit ./hello 2>&1 | tail -15
            log show --last 2m --style compact --predicate 'process == "kernel" OR process == "amfid" OR sender == "AppleMobileFileIntegrity"' 2>&1 | tail -30
          fi
          exit $code
