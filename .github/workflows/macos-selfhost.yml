name: macos-selfhost
# The compiler building itself on a Mac. Stage 1 is built here, on Linux, from the commit under test: the C
# bootstrap builds the self-hosted compiler, which cross-builds itself for each Mac architecture. The Mac then
# builds stage 2 from src/main.e; stage 2 builds stage 3; the two must be byte-identical, as on Linux and
# Windows. Stage 2 then builds and runs a program for its default target, which is the Mac itself (host_target).
on:
  workflow_dispatch:
jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap compiler
        run: sh scripts/build-bootstrap.sh
      - name: Self-hosted compiler
        run: build/linux/neper build src/main.e --arena 1g --output build/linux/neper-self
      - name: Cross-build for the Mac
        run: |
          mkdir -p /tmp/stage1
          for arch in aarch64 x64; do
            build/linux/neper-self emit-executable src/main.e . "$arch" macos "/tmp/stage1/neper-$arch-macos" --arena 1g
          done
          ls -l /tmp/stage1
      - uses: actions/upload-artifact@v4
        with:
          name: stage1
          path: /tmp/stage1
  selfhost:
    needs: stage1
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x64]
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rosetta
        if: matrix.arch == 'x64'
        run: softwareupdate --install-rosetta --agree-to-license 2>&1 | tail -2 || true
      - uses: actions/download-artifact@v4
        with:
          name: stage1
          path: /tmp
      - name: Stage 1
        run: |
          chmod +x /tmp/neper-${{ matrix.arch }}-macos
          sw_vers; uname -m
      - name: Stage 2 and stage 3
        run: |
          runner=()
          if [ "${{ matrix.arch }}" = "x64" ]; then runner=(arch -x86_64); fi
          s1=/tmp/neper-${{ matrix.arch }}-macos
          set -x
          "${runner[@]}" $s1 info --json | head -c 300; echo
          /usr/bin/time -l "${runner[@]}" $s1 emit-executable src/main.e . ${{ matrix.arch }} macos /tmp/stage2 --arena 1g
          chmod +x /tmp/stage2
          /usr/bin/time -l "${runner[@]}" /tmp/stage2 emit-executable src/main.e . ${{ matrix.arch }} macos /tmp/stage3 --arena 1g
          chmod +x /tmp/stage3
          ls -l /tmp/stage2 /tmp/stage3
          shasum -a 256 /tmp/stage2 /tmp/stage3
          cmp /tmp/stage2 /tmp/stage3 && echo "stage 2 == stage 3"
      - name: Default target is the Mac (host_target)
        run: |
          runner=()
          if [ "${{ matrix.arch }}" = "x64" ]; then runner=(arch -x86_64); fi
          cd "$GITHUB_WORKSPACE"
          "${runner[@]}" /tmp/stage3 build tests/selfhost/fixtures/link/basic/src/main.e -o /tmp/basic
          file /tmp/basic
          "${runner[@]}" /tmp/basic; echo "exit=$?"
