name: ios-sim
# The e.ui window in Mobile Safari on an iPhone simulator, driven through Appium (C213): the real iOS WebKit and soft keyboard,
# a finger's taps and holds. Stage 1 builds ui_counter.wasm on Linux; the Mac serves it on localhost (a secure origin, so the
# page can be cross-origin isolated) and tests/wasm/ios/drive.mjs types, holds and drags, reading the program's own output.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap compiler
        run: sh scripts/build-bootstrap.sh
      - name: Self-hosted compiler
        run: build/linux/neper build src/main.e --arena 1g --output build/linux/neper-self
      - name: ui_counter.wasm
        run: |
          mkdir -p /tmp/wasm
          build/linux/neper-self emit-executable tests/wasm/browser/ui_counter/src/main.e . wasm32 wasi /tmp/wasm/ui_counter.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: ui-counter-wasm
          path: /tmp/wasm
  phone:
    needs: build
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: ui-counter-wasm
          path: tests/wasm/browser
      - name: Appium and the driver
        run: |
          mkdir -p /tmp/drv && cd /tmp/drv && npm init -y >/dev/null
          npm i appium webdriverio >/dev/null 2>&1
          npx appium driver install xcuitest
      - name: Boot an iPhone simulator
        run: |
          xcrun simctl list devices available | grep -i iphone | head -20
          UDID=$(xcrun simctl list devices available -j | node -e 'const d=JSON.parse(require("fs").readFileSync(0));const all=Object.entries(d.devices).filter(([k])=>k.includes("iOS")).sort((a,b)=>a[0]<b[0]?1:-1).flatMap(([k,v])=>v.map(x=>({...x,runtime:k}))).filter(x=>/iPhone/.test(x.name));console.log(all[0].udid, all[0].runtime.split("iOS-")[1].replace(/-/g,"."))')
          set -- $UDID
          echo "UDID=$1" >> $GITHUB_ENV
          echo "IOS_VERSION=$2" >> $GITHUB_ENV
          xcrun simctl boot $1
          xcrun simctl bootstatus $1 -b
      - name: Serve the page
        run: |
          node scripts/serve-wasm.mjs --isolated > /tmp/serve.log 2>&1 &
          sleep 2; cat /tmp/serve.log
      - name: Start Appium
        run: |
          cd /tmp/drv && npx appium > /tmp/appium.log 2>&1 &
          sleep 10; tail -5 /tmp/appium.log
      - name: Drive Safari
        run: |
          cp tests/wasm/ios/drive.mjs /tmp/drv/drive.mjs
          mkdir -p /tmp/shots
          cd /tmp/drv && node drive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-sim-shots
          path: |
            /tmp/shots
            /tmp/appium.log
            /tmp/serve.log
