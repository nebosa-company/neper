<!doctype html>
<meta charset="utf-8">
<title>window_present</title>
<pre id="out">running</pre>
<script type="module">
  // lib/wasm/window.js's current page-side presenter (attach): random RGBA frames at three sizes
  // are sent through handle({ frame }) and read back from the 2D canvas. Every byte must survive.
  // Prints "window present ok", or which size differed. The presenter needs the same isolated page
  // required by the normal browser host because its event ring is a SharedArrayBuffer.
  import { attach } from '../../../lib/wasm/window.js'
  const out = document.getElementById('out')
  const lines = []
  if (!crossOriginIsolated) {
    lines.push('needs cross-origin isolation')
  } else {
    for (const [w, h] of [[64, 48], [97, 61], [480, 320]]) {
      const canvas = document.createElement('canvas')
      canvas.width = w
      canvas.height = h
      document.body.append(canvas)
      const presenter = attach(canvas)
      const rgba = new Uint8ClampedArray(w * h * 4)
      let state = 12345
      for (let i = 0; i < rgba.length; i++) { state = (state * 1103515245 + 12345) >>> 0; rgba[i] = state >>> 24 }
      for (let i = 3; i < rgba.length; i += 4) rgba[i] = 255
      presenter.handle({ frame: { rgba, width: w, height: h } })
      await new Promise((done) => requestAnimationFrame(done))
      const back = canvas.getContext('2d').getImageData(0, 0, w, h).data
      let differing = 0
      for (let i = 0; i < rgba.length; i++) if (back[i] !== rgba[i]) differing++
      if (differing) lines.push(`${w}x${h}: ${differing} bytes differ`)
      presenter.dispose()
      canvas.remove()
    }
  }
  out.textContent = lines.length ? lines.join('\n') : 'window present ok'
</script>
