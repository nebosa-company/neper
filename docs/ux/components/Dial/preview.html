<!doctype html>
<html lang="en">
<head><meta charset="utf-8"></head>
<body style="margin:0">
<div class="nu-page">
<div class="nu-stack" style="gap:var(--space-5)">
<div class="nu-col" style="gap:var(--space-3)">
<span class="nu-caption">Default 120: rest, hover on the handle, focus, dragged, disabled. A 270° sweep from lower left (minimum) to lower right</span>
<div class="nu-row" style="gap:var(--space-4);align-items:flex-start;flex-wrap:nowrap">
<div class="nu-a3-dial" role="slider" aria-label="CPU limit" aria-valuenow="65" aria-valuetext="65 percent">
<div class="face"><svg viewBox="0 0 100 100" aria-hidden="true"><path class="track" d="M21.72 78.28A40 40 0 1 1 78.28 78.28"/><path class="act" d="M21.72 78.28A40 40 0 0 1 75.98 19.58"/><circle class="knob" cx="75.98" cy="19.58" r="7"/></svg><div class="readout"><span>65</span><span class="unit">%</span></div></div>
<span class="name">CPU limit</span></div>
<div class="nu-a3-dial">
<div class="face"><svg viewBox="0 0 100 100" aria-hidden="true"><path class="track" d="M21.72 78.28A40 40 0 1 1 78.28 78.28"/><path class="act" d="M21.72 78.28A40 40 0 0 1 17.64 26.49"/><circle class="halo" cx="17.64" cy="26.49" r="15"/><circle class="knob" cx="17.64" cy="26.49" r="7"/></svg><div class="readout"><span>30</span><span class="unit">%</span></div></div>
<span class="name">Hover</span></div>
<div class="nu-a3-dial">
<div class="face"><svg viewBox="0 0 100 100" aria-hidden="true"><path class="track" d="M21.72 78.28A40 40 0 1 1 78.28 78.28"/><path class="act" d="M21.72 78.28A40 40 0 1 1 88.04 62.36"/><circle class="knob" cx="88.04" cy="62.36" r="7"/><circle class="ring" cx="88.04" cy="62.36" r="11.5"/></svg><div class="readout"><span>90</span><span class="unit">%</span></div></div>
<span class="name">Focus</span></div>
<div class="nu-a3-dial">
<div class="face"><svg viewBox="0 0 100 100" aria-hidden="true"><path class="track" d="M21.72 78.28A40 40 0 1 1 78.28 78.28"/><path class="act" d="M21.72 78.28A40 40 0 0 1 50 10"/><circle class="halo" cx="50" cy="10" r="15" style="opacity:var(--state-dragged)"/><circle class="knob" cx="50" cy="10" r="9"/></svg><div class="readout"><span>50</span><span class="unit">%</span></div></div>
<span class="name">Dragged</span></div>
<div class="nu-a3-dial is-disabled" aria-disabled="true">
<div class="face"><svg viewBox="0 0 100 100" aria-hidden="true"><path class="track" d="M21.72 78.28A40 40 0 1 1 78.28 78.28"/><path class="act" d="M21.72 78.28A40 40 0 0 1 75.98 19.58"/><circle class="knob" cx="75.98" cy="19.58" r="7"/></svg><div class="readout"><span>65</span><span class="unit">%</span></div></div>
<span class="name">Disabled</span></div>
</div>
</div>
<div class="nu-col" style="gap:var(--space-3)">
<span class="nu-caption">Small 72, in a dense inspector: the value inside, the label below</span>
<div class="nu-surface-demo nu-row" style="gap:var(--space-6);align-items:flex-start">
<div class="nu-a3-dial sm"><div class="face"><svg viewBox="0 0 100 100" aria-hidden="true"><path class="track" d="M21.72 78.28A40 40 0 1 1 78.28 78.28"/><path class="act" d="M21.72 78.28A40 40 0 0 1 10.49 43.74"/><circle class="knob" cx="10.49" cy="43.74" r="8"/></svg><div class="readout">20%</div></div><span class="name">Opacity</span></div>
<div class="nu-a3-dial sm"><div class="face"><svg viewBox="0 0 100 100" aria-hidden="true"><path class="track" d="M21.72 78.28A40 40 0 1 1 78.28 78.28"/><path class="act" d="M21.72 78.28A40 40 0 0 1 50 10"/><circle class="knob" cx="50" cy="10" r="8"/></svg><div class="readout">180°</div></div><span class="name">Hue</span></div>
<div class="nu-a3-dial sm"><div class="face"><svg viewBox="0 0 100 100" aria-hidden="true"><path class="track" d="M21.72 78.28A40 40 0 1 1 78.28 78.28"/><path class="act" d="M21.72 78.28A40 40 0 1 1 88.04 62.36"/><circle class="knob" cx="88.04" cy="62.36" r="8"/></svg><div class="readout">9 px</div></div><span class="name">Blur</span></div>
</div>
</div>
</div>
</div>
