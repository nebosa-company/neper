<!doctype html>
<html lang="en">
<head><meta charset="utf-8"></head>
<body style="margin:0">
<div class="nu-page">
<div class="nu-stack" style="gap:var(--space-5)">
<div class="nu-col" style="gap:var(--space-3);width:100%">
<span class="nu-caption">Filled, one section open (touch density)</span>
<div class="nu-a3-acc">
<div class="item"><button class="hd nu-sl nu-a3-inset" style="width:100%;text-align:left"><span class="text"><span class="t">General</span><span class="s">Name, location and default branch</span></span><svg class="nu-icon chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div>
<div class="item open"><button class="hd nu-sl nu-a3-inset" style="width:100%;text-align:left"><span class="text"><span class="t">Build</span><span class="s">Targets, cache and parallel jobs</span></span><svg class="nu-icon chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
<div class="bd">Builds run on 8 workers and reuse the artifact cache in <span class="code" style="color:var(--on-surface)">build/cache</span>. Clearing the cache makes the next build a full one.</div></div>
<div class="item"><button class="hd nu-sl nu-a3-inset" style="width:100%;text-align:left"><span class="text"><span class="t">Notifications</span><span class="s">Failed builds and review requests</span></span><svg class="nu-icon chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div>
<div class="item"><button class="hd nu-sl nu-a3-inset" style="width:100%;text-align:left"><span class="text"><span class="t">Members</span><span class="s">4 people have access</span></span><svg class="nu-icon chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div>
</div>
</div>
<div class="nu-col" style="gap:var(--space-3);width:100%">
<span class="nu-caption">Outlined, dense (pointer hosts): hover, focus, disabled</span>
<div class="nu-a3-acc outlined dense">
<div class="item"><button class="hd nu-sl nu-a3-inset is-hover" style="width:100%;text-align:left"><svg class="nu-icon lead" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h6l2 2h9v10h-17z"/></svg><span class="text"><span class="t">Source folders</span></span><svg class="nu-icon chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div>
<div class="item"><button class="hd nu-sl nu-a3-inset is-focus" style="width:100%;text-align:left"><svg class="nu-icon lead" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M7.5 10l2.5 2.5-2.5 2.5M12.5 15.5h4"/></svg><span class="text"><span class="t">Run configurations</span></span><svg class="nu-icon chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div>
<div class="item"><button class="hd nu-sl nu-a3-inset is-disabled" disabled style="width:100%;text-align:left"><svg class="nu-icon lead" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 19.5h14"/></svg><span class="text"><span class="t">Deployment (needs an owner)</span></span><svg class="nu-icon chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div>
</div>
</div>
</div>
</div>
