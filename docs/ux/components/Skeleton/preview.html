<!-- @dsCard group="Status" height=448 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"></head>
<body style="margin:0">
<div class="nu-page">
<div class="nu-stack" style="gap:var(--space-5)">
<div class="nu-row" style="gap:var(--space-6);align-items:flex-start;flex-wrap:nowrap">
<div class="nu-col" style="gap:var(--space-3);flex:1;align-items:stretch">
<span class="nu-caption">List rows: the shapes of the real rows, lines at 60% and 40%</span>
<div class="nu-list" role="status" aria-busy="true" aria-label="Loading members">
<div class="nu-li two" style="cursor:default"><span class="nu-skeleton round" style="width:40px;height:40px"></span><span class="text" style="gap:var(--space-2)"><span class="nu-skeleton" style="width:60%;height:14px"></span><span class="nu-skeleton" style="width:40%;height:12px"></span></span></div>
<div class="nu-li two" style="cursor:default"><span class="nu-skeleton round" style="width:40px;height:40px"></span><span class="text" style="gap:var(--space-2)"><span class="nu-skeleton" style="width:70%;height:14px"></span><span class="nu-skeleton" style="width:35%;height:12px"></span></span></div>
<div class="nu-li two" style="cursor:default"><span class="nu-skeleton round" style="width:40px;height:40px"></span><span class="text" style="gap:var(--space-2)"><span class="nu-skeleton" style="width:55%;height:14px"></span><span class="nu-skeleton" style="width:45%;height:12px"></span></span></div>
</div>
</div>
<div class="nu-col" style="gap:var(--space-3);width:260px">
<span class="nu-caption">Card: media, title, text and action</span>
<div class="nu-card outlined" style="width:260px" aria-hidden="true">
<div class="media" style="background:transparent;padding:0;height:112px"><span class="nu-skeleton" style="width:100%;height:100%;border-radius:0"></span></div>
<span class="nu-skeleton" style="display:block;width:70%;height:16px"></span>
<span class="nu-skeleton" style="display:block;width:100%;height:12px;margin-top:var(--space-3)"></span>
<span class="nu-skeleton" style="display:block;width:85%;height:12px;margin-top:var(--space-2)"></span>
<div class="actions"><span class="nu-skeleton pill" style="width:96px;height:40px"></span></div>
</div>
</div>
</div>
<div class="nu-col" style="gap:var(--space-3);width:100%">
<span class="nu-caption">Shimmer (one frame): a soft highlight sweeps start to end every 1.5 s; reduced motion keeps it still</span>
<div class="nu-col" style="gap:var(--space-2);width:100%">
<span class="nu-skeleton nu-a3-shimmer" style="width:100%;height:14px"></span>
<span class="nu-skeleton nu-a3-shimmer" style="width:92%;height:14px"></span>
<span class="nu-skeleton nu-a3-shimmer" style="width:64%;height:14px"></span>
</div>
</div>
</div>
</div>
</body>
</html>
