<!-- @dsCard group="Collections" height=300 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"></head>
<body style="margin:0">
<style>
.pv-s{display:flex;gap:var(--space-8);padding:var(--space-4);color:var(--on-surface);font:14px/20px var(--font-sans)}
.pv-s .cap{color:var(--on-surface-variant);font-size:12px;margin-bottom:8px}
.pv-s .box{display:flex;border:1px solid var(--outline-variant);border-radius:var(--radius-sm);background:var(--surface-container-low);overflow:hidden}
.pv-s .doc{padding:12px;width:200px;height:160px;color:var(--on-surface-variant)}
.pv-s .v{width:14px;background:var(--surface-container);position:relative}
.pv-s .v b{position:absolute;left:3px;right:3px;top:22%;height:38%;border-radius:9999px;background:var(--outline)}
.pv-s .v.hot b{background:var(--on-surface-variant)}
.pv-s .h{height:14px;width:220px;background:var(--surface-container);position:relative;border:1px solid var(--outline-variant);border-radius:var(--radius-sm)}
.pv-s .h b{position:absolute;top:3px;bottom:3px;left:12%;width:46%;border-radius:9999px;background:var(--outline)}
.pv-s .thin{width:6px;background:transparent}
.pv-s .thin b{left:1px;right:1px;background:var(--on-surface-variant)}
</style>
<div class="nu-page"><div class="pv-s">
  <div><div class="cap">Vertical, rest</div><div class="box"><div class="doc">Content taller than the viewport.</div><div class="v" role="scrollbar" aria-orientation="vertical" aria-valuenow="22"><b></b></div></div></div>
  <div><div class="cap">Vertical, dragged</div><div class="box"><div class="doc">The thumb is at full emphasis.</div><div class="v hot" role="scrollbar" aria-orientation="vertical" aria-valuenow="22"><b></b></div></div></div>
  <div><div class="cap">Overlay (thin)</div><div class="box"><div class="doc">Touch and macOS hosts.</div><div class="v thin" role="scrollbar" aria-orientation="vertical" aria-valuenow="22"><b></b></div></div></div>
  <div><div class="cap">Horizontal</div><div class="h" role="scrollbar" aria-orientation="horizontal" aria-valuenow="12"><b></b></div></div>
</div></div>
</body>
</html>
