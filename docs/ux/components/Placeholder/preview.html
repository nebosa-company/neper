<!-- @dsCard group="Status" height=543 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"></head>
<body style="margin:0">
<div class="nu-page">
<div class="nu-stack" style="gap:var(--space-5)">
<div class="nu-col" style="gap:var(--space-3);align-items:stretch">
<span class="nu-caption">Shapes: text line (12, round), block (radius-md), circle; the sweep passes over them</span>
<div class="nu-row" style="gap:var(--space-8);align-items:center;flex-wrap:nowrap">
<div class="nu-col" style="gap:var(--space-2);width:220px" aria-hidden="true">
<span class="nu-a2-ph line" style="width:100%"></span>
<span class="nu-a2-ph line" style="width:92%"></span>
<span class="nu-a2-ph line sweep" style="width:60%"></span>
</div>
<span class="nu-a2-ph md" style="width:120px;height:80px" aria-hidden="true"></span>
<span class="nu-a2-ph round" style="width:40px;height:40px" aria-hidden="true"></span>
<span class="nu-a2-ph round sweep" style="width:24px;height:24px" aria-hidden="true"></span>
</div>
</div>
<div class="nu-a2-grid two">
<div class="nu-col" style="gap:var(--space-3);align-items:stretch">
<span class="nu-caption">A list loading: the rows' own sizes</span>
<div class="nu-a2-desk" role="status" aria-busy="true" aria-label="Loading recent builds">
<div class="nu-li two" style="cursor:default"><span class="nu-a2-ph round" style="width:40px;height:40px"></span><span class="text" style="gap:var(--space-2)"><span class="nu-a2-ph line" style="width:70%"></span><span class="nu-a2-ph line" style="width:45%;height:10px"></span></span></div>
<div class="nu-li two" style="cursor:default"><span class="nu-a2-ph round sweep" style="width:40px;height:40px"></span><span class="text" style="gap:var(--space-2)"><span class="nu-a2-ph line sweep" style="width:55%"></span><span class="nu-a2-ph line sweep" style="width:35%;height:10px"></span></span></div>
<div class="nu-li two" style="cursor:default"><span class="nu-a2-ph round" style="width:40px;height:40px"></span><span class="text" style="gap:var(--space-2)"><span class="nu-a2-ph line" style="width:64%"></span><span class="nu-a2-ph line" style="width:40%;height:10px"></span></span></div>
</div>
</div>
<div class="nu-col" style="gap:var(--space-3);align-items:stretch">
<span class="nu-caption">A card loading: media, title, two lines</span>
<div class="nu-card outlined" role="status" aria-busy="true" aria-label="Loading project">
<div class="nu-a2-ph" style="height:96px;margin:calc(-1 * var(--space-4)) calc(-1 * var(--space-4)) var(--space-4);border-radius:0"></div>
<div class="nu-col" style="gap:var(--space-2);align-items:stretch">
<span class="nu-a2-ph line" style="width:50%;height:16px"></span>
<span class="nu-a2-ph line" style="width:100%"></span>
<span class="nu-a2-ph line" style="width:80%"></span>
</div>
</div>
</div>
</div>
<div class="nu-col" style="gap:var(--space-3);align-items:stretch">
<span class="nu-caption">Placeholder, then content: the same size, so nothing moves when it arrives</span>
<div class="nu-a2-grid two">
<div class="nu-a2-desk"><div class="nu-li two" style="cursor:default"><span class="nu-a2-ph round" style="width:40px;height:40px"></span><span class="text" style="gap:var(--space-2)"><span class="nu-a2-ph line" style="width:60%"></span><span class="nu-a2-ph line" style="width:40%;height:10px"></span></span></div></div>
<div class="nu-a2-desk"><div class="nu-li two"><span class="nu-avatar">AL</span><span class="text"><span class="headline">Build 4128 passed</span><span class="supporting">Ada Lovelace, 2 min ago</span></span></div></div>
</div>
</div>
</div>
</div>
</body>
</html>
