<!-- @dsCard group="Inputs" height=304 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"></head>
<body style="margin:0">
<div class="nu-page">
<div class="nu-stack" style="gap:var(--space-5)">
<div class="nu-row" style="gap:var(--space-10);align-items:flex-start">
<div class="nu-col" style="gap:var(--space-3)">
<span class="nu-caption">Outlined</span>
<div class="nu-a3-stepper" role="group" aria-label="Copies"><button class="nu-icon-btn sm" aria-label="Decrease copies"><svg class="nu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><span class="val">2</span><button class="nu-icon-btn sm" aria-label="Increase copies"><svg class="nu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
</div>
<div class="nu-col" style="gap:var(--space-3)">
<span class="nu-caption">Tonal, with a unit</span>
<div class="nu-a3-stepper tonal"><button class="nu-icon-btn sm" aria-label="Decrease font size"><svg class="nu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><span class="val">13 pt</span><button class="nu-icon-btn sm" aria-label="Increase font size"><svg class="nu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
</div>
<div class="nu-col" style="gap:var(--space-3)">
<span class="nu-caption">Small (density -1)</span>
<div class="nu-a3-stepper sm"><button class="nu-icon-btn sm" aria-label="Decrease retries"><svg class="nu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><span class="val">3</span><button class="nu-icon-btn sm" aria-label="Increase retries"><svg class="nu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
</div>
</div>
<div class="nu-col" style="gap:var(--space-3);width:100%">
<span class="nu-caption">In a settings row, at its lower bound: decrease is disabled</span>
<div class="nu-a3-setrow" style="max-width:480px"><span>Parallel jobs<span class="sub">1 to 64 workers</span></span>
<div class="nu-a3-stepper"><button class="nu-icon-btn sm is-disabled" disabled aria-label="Decrease parallel jobs"><svg class="nu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><span class="val">1</span><button class="nu-icon-btn sm" aria-label="Increase parallel jobs"><svg class="nu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div></div>
</div>
<div class="nu-col" style="gap:var(--space-3)">
<span class="nu-caption">States: hover on increase, focus on decrease, pressed, whole control disabled</span>
<div class="nu-row" style="gap:var(--space-6)">
<div class="nu-a3-stepper"><button class="nu-icon-btn sm" aria-label="Decrease"><svg class="nu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><span class="val">8</span><button class="nu-icon-btn sm is-hover" aria-label="Increase"><svg class="nu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
<div class="nu-a3-stepper"><button class="nu-icon-btn sm is-focus" aria-label="Decrease"><svg class="nu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><span class="val">8</span><button class="nu-icon-btn sm" aria-label="Increase"><svg class="nu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
<div class="nu-a3-stepper"><button class="nu-icon-btn sm" aria-label="Decrease"><svg class="nu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><span class="val">9</span><button class="nu-icon-btn sm is-pressed" aria-label="Increase"><svg class="nu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
<div class="nu-a3-stepper" style="border-color:color-mix(in srgb, var(--on-surface) 12%, transparent);color:color-mix(in srgb, var(--on-surface) 38%, transparent)"><button class="nu-icon-btn sm is-disabled" disabled aria-label="Decrease"><svg class="nu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><span class="val">8</span><button class="nu-icon-btn sm is-disabled" disabled aria-label="Increase"><svg class="nu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
</div>
</div>
</div>
</div>
</body>
</html>
