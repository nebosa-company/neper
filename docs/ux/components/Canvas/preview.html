<!doctype html>
<html lang="en">
<head><meta charset="utf-8"></head>

<text class="nu-a1-svg-label" x="36" y="84" text-anchor="end">60 s</text>
<text class="nu-a1-svg-label" x="36" y="134" text-anchor="end">30 s</text>
<text class="nu-a1-svg-label" x="36" y="184" text-anchor="end">0 s</text>
<text class="nu-a1-svg-label" x="52" y="204">Mon</text>

</svg>

</div>
<div class="nu-row" style="gap:var(--space-4)">
<span class="nu-row label-medium nu-muted" style="gap:var(--space-1)"><svg width="16" height="4" aria-hidden="true"><path class="nu-a1-stroke-primary" d="M1 2H15"/></svg>Build time</span>
<span class="nu-row label-medium nu-muted" style="gap:var(--space-1)"><svg width="16" height="4" aria-hidden="true"><path class="nu-a1-stroke-tertiary" d="M1 2H15"/></svg>Target</span>
<button class="nu-btn text sm">Show as table</button>
</div>
</div>
<div class="nu-col" style="gap:var(--space-4)">

</div>

</div>
</div>
</div>
</div>
</div>
