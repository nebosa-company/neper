<!-- @dsCard group="Actions" height=404 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"></head>
<body style="margin:0">
<div class="nu-page">
<div class="nu-stack" style="gap:var(--space-5)">
<div class="nu-col" style="gap:var(--space-3)">
<span class="nu-caption">Emphasis, high to low</span>
<div class="nu-row" style="gap:var(--space-3)">
<button class="nu-btn">Save changes</button>
<button class="nu-btn tonal">Duplicate</button>
<button class="nu-btn elevated">Share</button>
<button class="nu-btn outlined">Cancel</button>
<button class="nu-btn text">Learn more</button>
</div>
</div>
<div class="nu-col" style="gap:var(--space-3)">
<span class="nu-caption">With icons, destructive</span>
<div class="nu-row" style="gap:var(--space-3)">
<button class="nu-btn has-icon"><svg class="nu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New project</button>
<button class="nu-btn tonal has-icon"><svg class="nu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 19.5h14"/></svg>Export</button>
<button class="nu-btn outlined trailing-icon">Next<svg class="nu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
<button class="nu-btn danger has-icon"><svg class="nu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 4h4M7 7l1 13h8l1-13"/></svg>Delete</button>
</div>
</div>
<div class="nu-col" style="gap:var(--space-3)">
<span class="nu-caption">States: rest, hover, focus, pressed, disabled</span>
<div class="nu-row" style="gap:var(--space-3)">
<button class="nu-btn">Rest</button>
<button class="nu-btn is-hover">Hover</button>
<button class="nu-btn is-focus">Focus</button>
<button class="nu-btn is-pressed">Pressed</button>
<button class="nu-btn is-disabled" disabled>Disabled</button>
<button class="nu-btn outlined is-focus">Focus</button>
</div>
</div>
<div class="nu-col" style="gap:var(--space-3)">
<span class="nu-caption">Sizes: small 32 (desktop density), default 40, large 56</span>
<div class="nu-row" style="gap:var(--space-3)">
<button class="nu-btn sm">Small</button>
<button class="nu-btn">Default</button>
<button class="nu-btn lg">Large</button>
</div>
</div>
</div>
</div>
</body>
</html>
